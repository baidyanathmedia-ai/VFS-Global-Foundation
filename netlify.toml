[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) redirect rule
# Netlify serves static files (in /dist) first, then falls back to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control headers for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
